name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: typst-community/setup-typst@v5

      # Always install the latest calepin release — no version pin, no
      # cache. See README.md "Versioning policy" / ECOSYSTEM-WEBSITE-PLAN.md
      # §4 for why: calepin has no stability guarantees between releases,
      # and the site is meant to always build against the latest one.
      - name: Install calepin (latest)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/vincentarelbundock/calepin/releases/latest/download/calepin-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build site
        run: calepin compile . _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
